# The voice of Feris unless the student says otherwise in `student/voice.toml`, which has the
# same two tables. A table there that names another engine or player starts from empty
# settings; one that names the same keeps these and changes the keys it sets.

[engine]
# One of the engines in `voice/src/feris_voice/engines/`.
name = "qwen"
# A stock voice of Qwen3-TTS CustomVoice (aiden, dylan, eric, ono_anna, ryan, serena, sohee,
# uncle_fu, vivian), whose model is downloaded into the Hugging Face cache (see the README); or
# the name of a voice in `student/voices/`, such as one trained in the studio.
voice = "serena"
# For a voice in `student/voices/` whose model has several speakers: which one speaks.
# speaker = "<speaker>"
# The language spoken.
language = "spanish"

[player]
# "native" plays through the machine's own sound: PipeWire, PulseAudio or ALSA on Linux,
# Windows' own player on Windows. "fake" is for the lab: it records what it would play.
name = "native"
